[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sense-lca"
version = "1.1.0"
description = "Social and environmental nexus for sustainability evaluation using PSILCA, ecoinvent, and Brightway"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Nicolas Schröder" },
    { name = "Fabian Lechtenberg" },
    { name = "Gonzalo Guillén Gosálbez" },
]
keywords = [
    "life-cycle-assessment",
    "lca",
    "social-lca",
    "s-lca",
    "psilca",
    "ecoinvent",
    "brightway2",
    "sustainability",
    "semantic-matching",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "bw2data==3.6.6",
    "filelock>=3.13",
    "numpy>=1.21,<2",
    # Arrow 26 requires NumPy >=2, incompatible with this Brightway stack.
    "pyarrow>=10.0,<26",
    "pandas>=1.3",
    "sentence-transformers>=3.4.1",
    "tqdm>=4.60",
    "xmltodict>=0.13",
    "openpyxl>=3.0",
    "pycountry==24.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "build>=1.0",
    "PyYAML>=6.0",
]
ecoinvent-import = [
    "bw2io==0.8.12",
    "bw2calc==1.8.2",
]
# Fast sparse solver for bw2calc, selected per platform at install time.
# bw2calc prefers pypardiso (Intel MKL PARDISO) and otherwise falls back to
# SciPy, which routes through UMFPACK automatically when scikit-umfpack is
# importable. MKL does not exist for Apple Silicon, and scikit-umfpack has no
# prebuilt wheel compatible with numpy<2, so the two are complementary:
# pypardiso on Windows/Linux x86-64, a scikit-umfpack source build on macOS.
fast-solver = [
    "pypardiso>=0.4.5; (sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "scikit-umfpack>=0.4.2; sys_platform == 'darwin'",
]
tutorial = ["jupyterlab>=4.0", "ipykernel>=6.0", "bw2calc==1.8.2"]
case-study = [
    "brightway2==2.4.7",
    "bw2analyzer==0.10",
    "bw2calc==1.8.2",
    "bw2io==0.8.12",
    "geopandas==1.1.2",
    "matplotlib>=3.10",
    "PyYAML>=6.0",
    "regioinvent==1.4.0.2",
    "sense-lca[fast-solver]",
    "wurst==0.4",
]

[project.urls]
Homepage = "https://github.com/nicoschr/SENSE"
Repository = "https://github.com/nicoschr/SENSE"
Issues = "https://github.com/nicoschr/SENSE/issues"
Documentation = "https://github.com/nicoschr/SENSE#readme"

[project.scripts]
sense = "sense.cli:main"

