[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sense-lca"
version = "0.1.0"
description = "Social-Economic-Nexus for Sustainability Evaluation - Integrate PSILCA social LCA data into ecoinvent using Brightway2"
readme = "README.md"
license = "MIT"
requires-python = "==3.11.8"
authors = [
    { name = "SENSE Contributors" },
]
keywords = [
    "life-cycle-assessment",
    "lca",
    "social-lca",
    "s-lca",
    "psilca",
    "ecoinvent",
    "brightway2",
    "sustainability",
    "semantic-matching",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "bw2data==3.6.6",
    "bw2io==0.8.12",
    "bw2calc==1.8.2",
    "numpy>=1.21",
    "pandas>=1.3",
    "sentence-transformers>=2.0",
    "tqdm>=4.60",
    "xmltodict>=0.13",
    "openpyxl>=3.0",
    "regioinvent==1.3.0",
    "wurst==0.4",
    'pypardiso==0.4.7; platform_system=="Windows"',
    'scikit-umfpack; platform_system=="Darwin"',
    "geopandas==1.1.2",
    "pycountry==24.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/nicoschr/SENSE"

[project.scripts]
sense = "sense.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sense"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["sense"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=sense --cov-report=term-missing"
